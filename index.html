<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenLearn - Home</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4caf50, #81c784);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            margin: 10px;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }

        .student-btn {
            background: #2e7d32;
        }

        .student-btn:hover {
            background: #1b5e20;
        }

        .teacher-btn {
            background: #1565c0;
        }

        .teacher-btn:hover {
            background: #0d47a1;
        }

        footer {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌍 Welcome to GreenLearn</h1>
        <p>Your interactive eco-friendly learning assistant</p>

        <a href="student.html" class="btn student-btn">👩‍🎓 Student Login</a>
        <a href="teacher.html" class="btn teacher-btn">👩‍🏫 Teacher Login</a>

        <footer>© 2025 GreenLearn | Built for sustainable learning 🌱</footer>
    </div>
</body>

</html>
